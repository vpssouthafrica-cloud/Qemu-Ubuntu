name: TS Test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join tailnet and report
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "$TS_AUTHKEY" --hostname "vortax-test-${GITHUB_RUN_ID}" --accept-routes --accept-dns=false --timeout 90s
          echo "=== STATUS ==="
          sudo tailscale status || true
          echo "=== IP ==="
          sudo tailscale ip -4 || true
          sudo tailscale logout || true
